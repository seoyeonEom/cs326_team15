<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1440" height="397" viewBox="0 147 1440 397" role="img" aria-labelledby="diagram-title diagram-description"><ns0:title id="diagram-title">Sprint 3 — Team 15 System Architecture</ns0:title><ns0:desc id="diagram-description">Browser and EJS views go through Express routes, controllers, services, Mongoose repositories to MongoDB. Jest unit tests call services with mocked repository modules and no database. DTOs and shared helpers support the main flow.</ns0:desc><ns0:defs><ns0:marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><ns0:path d="M 0 0 L 10 5 L 0 10 z" fill="#9aaabc" /></ns0:marker><ns0:marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><ns0:path d="M 0 0 L 10 5 L 0 10 z" fill="#8063ba" /></ns0:marker></ns0:defs><ns0:rect width="1440" height="580" fill="#f8fafc" /><ns0:rect x="46" y="173" width="178" height="158" rx="12" fill="#ffffff" stroke="#ccd7e5" stroke-width="1.7" /><ns0:text x="135.0" y="205" font-size="19" font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#29435c" text-anchor="middle">Browser / Views</ns0:text><ns0:text x="135.0" y="233" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="normal" fill="#556779" text-anchor="middle">EJS pages</ns0:text><ns0:text x="135.0" y="255" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="normal" fill="#556779" text-anchor="middle">public/app.js</ns0:text><ns0:text x="135.0" y="277" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="normal" fill="#556779" text-anchor="middle">public/style.css</ns0:text><ns0:rect x="280" y="173" width="178" height="158" rx="12" fill="#ffffff" stroke="#ccd7e5" stroke-width="1.7" /><ns0:text x="369.0" y="205" font-size="19" font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#29435c" text-anchor="middle">Routes</ns0:text><ns0:text x="369.0" y="233" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="normal" fill="#556779" text-anchor="middle">activities.js</ns0:text><ns0:text x="369.0" y="255" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="normal" fill="#556779" text-anchor="middle">activityRecords.js</ns0:text><ns0:text x="369.0" y="277" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="normal" fill="#556779" text-anchor="middle">goals.js</ns0:text><ns0:rect x="514" y="173" width="178" height="158" rx="12" fill="#ffffff" stroke="#ccd7e5" stroke-width="1.7" /><ns0:text x="603.0" y="205" font-size="19" font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#29435c" text-anchor="middle">Controllers</ns0:text><ns0:text x="603.0" y="233" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="normal" fill="#556779" text-anchor="middle">Activities</ns0:text><ns0:text x="603.0" y="255" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="normal" fill="#556779" text-anchor="middle">Activity Records</ns0:text><ns0:text x="603.0" y="277" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="normal" fill="#556779" text-anchor="middle">Goals</ns0:text><ns0:rect x="748" y="173" width="178" height="158" rx="12" fill="#f3f8ff" stroke="#75a2d5" stroke-width="1.7" /><ns0:text x="837.0" y="205" font-size="19" font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#174b7d" text-anchor="middle">Services</ns0:text><ns0:text x="837.0" y="233" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="normal" fill="#556779" text-anchor="middle">Activities / Goals</ns0:text><ns0:text x="837.0" y="255" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="normal" fill="#556779" text-anchor="middle">validation, calculations</ns0:text><ns0:text x="837.0" y="277" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight=