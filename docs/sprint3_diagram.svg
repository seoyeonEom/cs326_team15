<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 140 1440 470" role="img" aria-labelledby="svgTitle svgDesc">
  <desc id="svgDesc">Browser and EJS views connect to Express routes, controllers, services, repositories and MongoDB. A small DTO box below services converts MongoDB _id to client-facing id. Jest tests exercise services with mocked repositories.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#9CACBE" />
    </marker>
    <marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#8167B6" />
    </marker>
  </defs>

  <rect x="0" y="140" width="1440" height="470" rx="0" fill="#F7FAFD" stroke="none" stroke-width="0" />

  <!-- layer boxes -->
  <rect x="46" y="170" width="178" height="157" rx="12" fill="#FFFFFF" stroke="#C9D7E6" stroke-width="1.5" />
  <text x="135.0" y="201" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#23435F" text-anchor="middle">Browser / Views</text>
  <text x="135.0" y="230" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">EJS templates</text>
  <text x="135.0" y="251" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">public/app.js</text>
  <text x="135.0" y="272" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">public/style.css</text>

  <rect x="280" y="170" width="178" height="157" rx="12" fill="#FFFFFF" stroke="#C9D7E6" stroke-width="1.5" />
  <text x="369.0" y="201" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#23435F" text-anchor="middle">Routes</text>
  <text x="369.0" y="230" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">activities.js</text>
  <text x="369.0" y="251" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">activityRecords.js</text>
  <text x="369.0" y="272" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">goals.js</text>

  <rect x="514" y="170" width="178" height="157" rx="12" fill="#FFFFFF" stroke="#C9D7E6" stroke-width="1.5" />
  <text x="603.0" y="201" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#23435F" text-anchor="middle">Controllers</text>
  <text x="603.0" y="230" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">Activities</text>
  <text x="603.0" y="251" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">Activity Records</text>
  <text x="603.0" y="272" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">Goals</text>

  <rect x="748" y="170" width="178" height="157" rx="12" fill="#F4F8FF" stroke="#8BB2DD" stroke-width="1.5" />
  <text x="837.0" y="201" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1F527E" text-anchor="middle">Services</text>
  <text x="837.0" y="230" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">Activities / Goals</text>
  <text x="837.0" y="251" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">validation, emissions</text>
  <text x="837.0" y="272" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">and goal progress</text>

  <rect x="982" y="170" width="178" height="157" rx="12" fill="#F0FAF6" stroke="#60B9A0" stroke-width="1.5" />
  <text x="1071.0" y="201" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#126A56" text-anchor="middle">Repositories</text>
  <text x="1071.0" y="230" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">Activities / Goals</text>
  <text x="1071.0" y="251" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">Mongoose schemas</text>
  <text x="1071.0" y="272" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">per-record CRUD</text>

  <rect x="1216" y="170" width="178" height="157" rx="12" fill="#F0FAF6" stroke="#60B9A0" stroke-width="1.5" />
  <text x="1305.0" y="201" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#126A56" text-anchor="middle">MongoDB</text>
  <text x="1305.0" y="230" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">devdb</text>
  <text x="1305.0" y="251" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">activities collection</text>
  <text x="1305.0" y="272" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">goals collection</text>

  <!-- arrows -->
  <path d="M 224 248.5 H 273" fill="none" stroke="#9CACBE" stroke-width="2.15" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M 458 248.5 H 507" fill="none" stroke="#9CACBE" stroke-width="2.15" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M 692 248.5 H 741" fill="none" stroke="#9CACBE" stroke-width="2.15" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M 926 248.5 H 975" fill="none" stroke="#9CACBE" stroke-width="2.15" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M 1160 248.5 H 1209" fill="none" stroke="#9CACBE" stroke-width="2.15" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />

  <!-- DTO -->
  <path d="M 837 327 V 373" fill="none" stroke="#8167B6" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow-violet)" />
  <rect x="772" y="376" width="130" height="52" rx="9" fill="#EDF7F5" stroke="#73B8A6" stroke-width="1.4" />
  <text x="837" y="397" font-size="14" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#176B5B" text-anchor="middle">DTOs</text>
  <text x="837" y="414" font-size="11" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#568577" text-anchor="middle">activity · goal</text>

  <!-- testing -->
  <text x="650" y="465" font-size="12" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#7256A5" text-anchor="start">SERVICE-LAYER TESTING</text>
  <rect x="605" y="481" width="303" height="99" rx="12" fill="#FAF7FF" stroke="#B8A2DF" stroke-width="1.5" />
  <text x="756.5" y="512" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#5F438D" text-anchor="middle">Jest Tests</text>
  <text x="756.5" y="541" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">activitiesService.test.js</text>
  <text x="756.5" y="562" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">goalsService.test.js</text>

  <rect x="964" y="481" width="330" height="99" rx="12" fill="#FAF7FF" stroke="#B8A2DF" stroke-width="1.5" />
  <text x="1129.0" y="512" font-size="18" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#5F438D" text-anchor="middle">Mocked Repositories</text>
  <text x="1129.0" y="541" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">jest.unstable_mockModule()</text>
  <text x="1129.0" y="562" font-size="13" font-family="Arial, Helvetica, sans-serif" font-weight="400" fill="#5B7084" text-anchor="middle">replaces real data access</text>

  <!-- arrows -->
  <path d="M 731 481 V 356 H 761 V 331" fill="none" stroke="#8167B6" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#arrow-violet)" />
  <path d="M 908 530 H 957" fill="none" stroke="#8167B6" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#arrow-violet)" />
