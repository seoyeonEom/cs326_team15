<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="svgTitle svgDesc">
<title id="svgTitle">System architecture with session authentication and authorization</title>
<desc id="svgDesc">The main request path runs from browser and EJS views through routes, controllers, services, repositories and MongoDB. Protected routes use requireLogin. Services enforce activity ownership or admin rights and assign goal ownerId. The browser stores a signed HttpOnly sessionId cookie. attachUser looks up the session in a server-memory Map and sets req.user. Jest tests use mocked repositories. DTOs map database identifiers to client-facing ids.</desc>
